[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfi-simulator"
version = "0.1.0.dev0"
description = "Voltage-level radio-frequency-interference simulator for radio interferometry"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "pyyaml",
    "sgp4>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]
webui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
rfi-simulator-ui = "rfi_simulator.webui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rfi_simulator.webui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs at the full package defaults (a few seconds each)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]
